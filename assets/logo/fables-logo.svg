<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="Fables of Whimsy">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e6b0"/>
      <stop offset=".45" stop-color="#e4c983"/>
      <stop offset=".7" stop-color="#c6a15b"/>
      <stop offset="1" stop-color="#8c6d34"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round">
