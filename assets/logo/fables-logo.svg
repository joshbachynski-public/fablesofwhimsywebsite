      <path d="M0 12 L0 28" />
      <circle cx="0" cy="-8" r="11"/>
      <path d="M4 -13 a8 8 0 1 0 0 12" fill="#0a0a0c" stroke="none"/>
      <circle cx="-26" cy="-14" r="1.4" fill="url(#gold)" stroke="none"/>
      <circle cx="24" cy="-18" r="1.2" fill="url(#gold)" stroke="none"/>
      <circle cx="30" cy="0" r="1.1" fill="url(#gold)" stroke="none"/>
      <circle cx="-30" cy="2" r="1.1" fill="url(#gold)" stroke="none"/>
      <path d="M-52 8 C-64 4 -64 -14 -50 -16" />
      <path d="M52 8 C64 4 64 -14 50 -16" />
    </g>
  </g>
  <g fill="url(#gold)">
    <text x="260" y="104" text-anchor="middle" font-family="'Cinzel','Cormorant Garamond',serif" font-size="30" letter-spacing="6">FABLES OF WHIMSY</text>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round">
    <path d="M150 128 C200 118 320 118 370 128"/>
