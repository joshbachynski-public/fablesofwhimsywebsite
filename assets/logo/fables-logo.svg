    <circle cx="370" cy="128" r="2" fill="url(#gold)" stroke="none"/>
    <text x="260" y="146" text-anchor="middle" font-family="'Marcellus',serif" font-size="10" letter-spacing="7" fill="url(#gold)" stroke="none">A BOOKISH COLLECTIVE</text>
  </g>
