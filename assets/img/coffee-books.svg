<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A steaming cup of coffee beside a stack of books in warm morning light">
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a12"/>
      <stop offset="0.55" stop-color="#1a130e"/>
      <stop offset="1" stop-color="#0f0a07"/>
    </linearGradient>
    <radialGradient id="cbLight" cx="0.72" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#ffd78f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd78f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#241811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cbBg)"/>
  <rect width="1200" height="800" fill="url(#cbLight)"/>

  <!-- table surface -->
  <rect y="560" width="1200" height="240" fill="url(#cbTable)"/>
  <path d="M0 560 H1200" stroke="#c6a15b" stroke-width="1" opacity="0.28"/>

  <!-- stack of books -->
  <g>
    <rect x="150" y="512" width="360" height="46" rx="4" fill="#4b2d55"/>
    <rect x="150" y="512" width="360" height="10" fill="#5c3a68"/>
    <rect x="170" y="470" width="330" height="44" rx="4" fill="#0d3b2c"/>
    <rect x="170" y="470" width="330" height="10" fill="#14503c"/>
    <rect x="140" y="430" width="345" height="42" rx="4" fill="#8c6d34"/>
    <rect x="140" y="430" width="345" height="10" fill="#a9843f"/>
    <!-- page edges -->
    <rect x="475" y="516" width="30" height="38" fill="#e9dcb4"/>
    <rect x="465" y="474" width="30" height="36" fill="#e9dcb4"/>
    <rect x="450" y="434" width="30" height="34" fill="#e9dcb4"/>
    <!-- spine flourishes -->
    <path d="M180 535 h120 M180 528 h90" stroke="#e4c983" stroke-width="2" opacity="0.7"/>
    <path d="M200 492 h100" stroke="#e4c983" stroke-width="2" opacity="0.6"/>
    <path d="M170 451 h130" stroke="#3a2a12" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- open book resting on top -->
  <g>
    <path d="M300 430 C 360 410 420 410 470 428 L470 430 C 420 414 360 414 300 432 Z" fill="#e9dcb4"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(720 430)">
    <ellipse cx="90" cy="150" rx="120" ry="26" fill="#000" opacity="0.35"/>
    <path d="M20 60 h140 a12 12 0 0 1 12 12 v10 a70 70 0 0 1 -164 0 v-10 a12 12 0 0 1 12 -12 z" fill="#1c140f" stroke="#c6a15b" stroke-width="2.5"/>
    <ellipse cx="90" cy="62" rx="72" ry="18" fill="#2a1c12" stroke="#c6a15b" stroke-width="2"/>
    <ellipse cx="90" cy="62" rx="58" ry="13" fill="#4a3016"/>
    <ellipse cx="90" cy="60" rx="40" ry="8" fill="#6b4a24" opacity="0.7"/>
    <!-- handle -->
    <path d="M168 78 a34 30 0 0 1 0 56" fill="none" stroke="#c6a15b" stroke-width="6"/>
    <!-- saucer -->
    <ellipse cx="90" cy="148" rx="118" ry="22" fill="#1c140f" stroke="#c6a15b" stroke-width="2.5"/>
    <!-- steam -->
    <path d="M64 44 C 52 22 76 14 62 -8" fill="none" stroke="#e9dcb4" stroke-width="3" opacity="0.35" stroke-linecap="round"/>
    <path d="M110 44 C 98 20 122 12 108 -12" fill="none" stroke="#e9dcb4" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- scattered coffee beans -->
  <g fill="#3a2410" stroke="#c6a15b" stroke-width="1">
    <ellipse cx="500" cy="640" rx="13" ry="8" transform="rotate(24 500 640)"/>
    <ellipse cx="540" cy="662" rx="13" ry="8" transform="rotate(-16 540 662)"/>
    <ellipse cx="470" cy="672" rx="13" ry="8" transform="rotate(40 470 672)"/>
  </g>

  <!-- foliage flourish, top-left corner -->
  <g stroke="#0d3b2c" stroke-width="3" fill="none" opacity="0.85">
    <path d="M-10 120 C 90 90 150 150 130 240"/>
    <path d="M60 118 c 22 -18 46 -10 52 12 c -24 4 -44 -2 -52 -12z" fill="#14503c" stroke-width="1.5"/>
    <path d="M96 178 c 24 -14 48 -2 52 20 c -26 2 -46 -6 -52 -20z" fill="#14503c" stroke-width="1.5"/>
  </g>
</svg>
