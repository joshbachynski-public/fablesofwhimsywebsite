<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A moonlit night sky over a lone tower with a lit window">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080c"/>
      <stop offset="0.42" stop-color="#121a2e"/>
      <stop offset="0.72" stop-color="#22162a"/>
      <stop offset="1" stop-color="#4b2d55"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4ebcb" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#e4c983" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e4c983" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#faf3d8"/>
      <stop offset="0.7" stop-color="#e4c983"/>
      <stop offset="1" stop-color="#c6a15b"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2c"/>
      <stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe8ad"/>
      <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="880" cy="230" r="230" fill="url(#moonGlow)"/>
  <circle cx="880" cy="230" r="96" fill="url(#moonBody)"/>
  <circle cx="852" cy="208" r="16" fill="#d8bd7c" opacity="0.5"/>
  <circle cx="905" cy="252" r="11" fill="#d8bd7c" opacity="0.45"/>
  <circle cx="892" cy="200" r="7" fill="#d8bd7c" opacity="0.4"/>

  <!-- stars -->
  <g fill="#f4ebcb">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="260" cy="150" r="1.1" opacity="0.7"/>
    <circle cx="420" cy="70" r="1.8" opacity="0.85"/>
    <circle cx="560" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="180" cy="240" r="1.3" opacity="0.7"/>
    <circle cx="330" cy="300" r="1" opacity="0.55"/>
    <circle cx="640" cy="60" r="1.4" opacity="0.75"/>
    <circle cx="1040" cy="120" r="1.5" opacity="0.8"/>
    <circle cx="1120" cy="300" r="1.2" opacity="0.65"/>
    <circle cx="70" cy="360" r="1.1" opacity="0.6"/>
    <circle cx="500" cy="330" r="1.3" opacity="0.6"/>
    <circle cx="240" cy="420" r="1" opacity="0.5"/>
    <circle cx="1150" cy="180" r="1.3" opacity="0.7"/>
    <circle cx="960" cy="400" r="1.1" opacity="0.55"/>
  </g>
  <!-- gold twinkles -->
  <g fill="#e4c983">
    <path d="M300 110 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z" opacity="0.85"/>
    <path d="M720 200 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4-6 -6-2.4 6-2.4z" opacity="0.75"/>
    <path d="M110 200 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z" opacity="0.7"/>
    <path d="M1080 240 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4-6 -6-2.4 6-2.4z" opacity="0.7"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 640 C 220 590 380 620 560 610 C 760 600 950 640 1200 600 L1200 800 L0 800 Z" fill="url(#hill)"/>
  <path d="M0 700 C 260 670 520 700 760 690 C 980 682 1100 705 1200 695 L1200 800 L0 800 Z" fill="#050a08"/>

  <!-- the tower -->
  <g>
    <rect x="560" y="360" width="70" height="300" fill="#0a0f0d"/>
    <path d="M560 360 L595 300 L630 360 Z" fill="#0a0f0d"/>
    <path d="M595 300 L595 274" stroke="#c6a15b" stroke-width="2"/>
    <path d="M595 278 l3 7 7 -1 -4 6 3 7 -6-3 -6 3 3-7 -4-6 7 1z" fill="#e4c983"/>
    <!-- lit window -->
    <circle cx="595" cy="470" r="34" fill="url(#window)"/>
    <rect x="583" y="452" width="24" height="34" rx="12" fill="#ffe8ad"/>
    <rect x="583" y="540" width="24" height="30" rx="12" fill="#c6a15b" opacity="0.35"/>
    <path d="M560 360 h70" stroke="#c6a15b" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- faint art-nouveau vignette flourish -->
  <path d="M40 60 C 120 90 130 160 90 210" fill="none" stroke="#c6a15b" stroke-width="1.2" opacity="0.25"/>
  <path d="M1160 60 C 1080 90 1070 160 1110 210" fill="none" stroke="#c6a15b" stroke-width="1.2" opacity="0.25"/>
</svg>
